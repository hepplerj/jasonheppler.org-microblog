{{ define "main" }}
<header class="lm-archive-head">
  <p class="lm-label">Category</p>
  <h1 class="lm-archive-title">{{ .Title }}</h1>
  {{ with .Content }}<div class="lm-archive-lead">{{ . }}</div>{{ end }}
</header>

{{ $paginator := .Paginate .Pages.ByDate.Reverse 10 }}
<div class="lm-mb-list h-feed">
  {{ range $paginator.Pages }}{{ partial "post-card.html" . }}{{ end }}
</div>
{{ partial "pager.html" $paginator }}
{{ end }}
