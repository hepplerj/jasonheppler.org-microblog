{{ define "main" }}
<article class="lm-article h-entry">
  <header class="lm-article-head">
    <div class="lm-mb-single-head">
      {{ if .Title }}<h1 class="lm-article-title p-name">{{ .Title }}</h1>{{ else }}<span></span>{{ end }}
      <a href="{{ .Permalink }}" class="lm-mb-date u-url"><time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">{{ .Date.Format "January 2, 2006" }}</time></a>
    </div>
  </header>

  <div class="lm-prose e-content">
    {{ .Content }}
  </div>

  {{ partial "author-card.html" . }}

  {{ if .Site.Params.include_conversation }}
  <script type="text/javascript" src="https://micro.blog/conversation.js?url={{ .Permalink }}"></script>
  {{ end }}
</article>
{{ end }}
