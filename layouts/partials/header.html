<!-- Mobile header -->
<nav class="mobile-header">

        <button class="icon-btn" id="sidebarToggle" aria-label="Toggle menu">
            <svg id="sidebarMenuIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg id="sidebarCloseIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <div class="site-title"><a href="/">{{ .Site.Title }}</a></div>
        <button class="icon-btn theme-btn" id="themeToggle" aria-label="Toggle theme">
            <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 244 255" role="presentation">

                <g fill="currentColor" fill-rule="evenodd">

</nav>

<!-- Left sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="site-title"><a href="/">{{ .Site.Title }}</a></div>
        <button class="icon-btn theme-btn desktop-theme-toggle" id="desktopThemeToggle" aria-label="Toggle theme">
            <svg id="desktopMoonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 244 255" role="presentation">
                <path fill="currentColor" fill-rule="evenodd" d="M3.6 98.7a127 127 0 01182-84.3 102 102 0 1058.5 163A127 127 0 13.6 98.6z"></path>
            </svg>
            <svg id="desktopSunIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 254 254" role="presentation">
                <g fill="currentColor" fill-rule="evenodd">
                    <circle cx="127" cy="127" r="45"></circle>
                    <path d="M118 209v-.3a9 9 0 0118 .3v36a9 9 0 11-18 0v-36zM118 9v-.3a9 9 0 0118 .3v36a9 9 0 11-18 0V9zM178.6 191.3l-.2-.1a9 9 0 0113-12.6l25.4 25.5a9 9 0 11-12.7 12.7l-25.5-25.5zM37.2 50l-.2-.3a9 9 0 0113-12.5l25.4 25.5a9 9 0 01-12.7 12.7L37.2 49.9zM209 136h-.3a9 9 0 01.3-18h36a9 9 0 110 18h-36zM9 136h-.3a9 9 0 01.3-18h36a9 9 0 110 18H9zM191.3 75.4l-.1.2a9 9 0 01-12.6-13l25.5-25.4a9 9 0 1112.7 12.7l-25.5 25.5zM50 216.8l-.3.2a9 9 0 01-12.5-13l25.5-25.4a9 9 0 1112.7 12.7l-25.5 25.5z"></path>

            </svg>
        </button>
    </div>
    <nav class="sidebar-nav">
        <a href="https://jasonheppler.org">← Main Site</a>
        <a href="/">Home</a>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
        <a href="/about/">About</a>
    </nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
