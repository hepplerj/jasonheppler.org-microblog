<div class="lm-author p-author h-card">
  <div class="lm-author-profile">
    <img src="https://jasonheppler.org/assets/images/portrait.webp" alt="Jason A. Heppler" class="u-photo" width="56" height="56">
    <div class="lm-author-text">
      <a class="lm-author-name p-name u-url" href="https://jasonheppler.org">Jason A. Heppler</a>
      <span class="lm-author-role">Environmental &amp; digital historian</span>
    </div>
    <div class="lm-author-links">
      <a href="https://bsky.app/profile/jasonheppler.org">Bluesky</a>
      <a href="https://hcommons.social/@jaheppler" rel="me">Mastodon</a>
      <a href="https://github.com/hepplerj">GitHub</a>
    </div>
  </div>
  <p class="lm-post-meta lm-author-meta">
    {{ partial "carbon-badge.html" . }}
    {{ with .Params.categories }}<span class="lm-dot-sep">·</span><span class="lm-author-tags">{{ range $i, $c := . }}{{ if $i }}<span class="lm-dot-sep">·</span>{{ end }}<a href="/categories/{{ $c | urlize }}/">{{ $c }}</a>{{ end }}</span>{{ end }}
  </p>
</div>
