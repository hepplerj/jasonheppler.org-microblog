<script>
// Theme toggle - Mobile
const themeToggle = document.getElementById('themeToggle');
const moonIcon = document.getElementById('moonIcon');
const sunIcon = document.getElementById('sunIcon');

// Theme toggle - Desktop
const desktopThemeToggle = document.getElementById('desktopThemeToggle');
const desktopMoonIcon = document.getElementById('desktopMoonIcon');
const desktopSunIcon = document.getElementById('desktopSunIcon');

const currentTheme = localStorage.getItem('theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

document.documentElement.setAttribute('data-site-theme', currentTheme);

// Set initial theme icons
if (currentTheme === 'dark') {
    moonIcon?.classList.add('hidden');
    sunIcon?.classList.remove('hidden');
    desktopMoonIcon?.classList.add('hidden');
    desktopSunIcon?.classList.remove('hidden');
}

// Handle theme toggle
function toggleTheme() {
    const theme = document.documentElement.getAttribute('data-site-theme');
    const newTheme = theme === 'dark' ? 'light' : 'dark';

    document.documentElement.setAttribute('data-site-theme', newTheme);
    localStorage.setItem('theme', newTheme);

    moonIcon?.classList.toggle('hidden');
    sunIcon?.classList.toggle('hidden');
    desktopMoonIcon?.classList.toggle('hidden');
    desktopSunIcon?.classList.toggle('hidden');
}

themeToggle?.addEventListener('click', toggleTheme);
desktopThemeToggle?.addEventListener('click', toggleTheme);

// Sidebar toggle
const sidebarToggle = document.getElementById('sidebarToggle');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const sidebarMenuIcon = document.getElementById('sidebarMenuIcon');
const sidebarCloseIcon = document.getElementById('sidebarCloseIcon');

sidebarToggle?.addEventListener('click', () => {
    sidebar.classList.toggle('active');
    sidebarOverlay.classList.toggle('active');
    sidebarMenuIcon.classList.toggle('hidden');
    sidebarCloseIcon.classList.toggle('hidden');
});

sidebarOverlay?.addEventListener('click', () => {
    sidebar.classList.remove('active');
    sidebarOverlay.classList.remove('active');
    sidebarMenuIcon.classList.remove('hidden');
    sidebarCloseIcon.classList.add('hidden');
});
</script>
