<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="lm-skip-link" href="#main-content">Skip to content</a>
  {{ partial "header.html" . }}
  <main class="lm-wrap" id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  <div class="lm-wrap">
    {{ partial "footer.html" . }}
  </div>
  {{ partial "custom_footer.html" . }}
</body>
</html>
